[package]
name = "narayan-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "narayan-web"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "limit"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# File handling
tempfile = "3.10"
uuid = { version = "1.7", features = ["v4", "serde"] }
zip = "2.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
parking_lot = "0.12"
dashmap = "5.5"

[dev-dependencies]
# Testing
reqwest = { version = "0.11", features = ["multipart"] }
tokio-test = "0.4"

# For release builds, optimize for size and performance
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
