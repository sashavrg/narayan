version: '3.8'

services:
  flac-to-mp3-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flac-to-mp3-converter
    ports:
      - "8080:8080"  # Map host port 8080 to container port 8080
    volumes:
      # Optional: Mount volumes to persist converted files
      - ./output:/tmp/mp3_output
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.flac-to-mp3.description=FLAC to MP3 Converter Web Service"
      - "com.flac-to-mp3.version=1.0.0"

# Optional: If you want to add a reverse proxy (uncomment below)
# nginx:
#   image: nginx:alpine
#   container_name: flac-converter-proxy
#   ports:
#     - "80:80"
#   volumes:
#     - ./nginx.conf:/etc/nginx/nginx.conf:ro
#   depends_on:
#     - flac-to-mp3-web
#   restart: unless-stopped

volumes:
  output:
    driver: local
